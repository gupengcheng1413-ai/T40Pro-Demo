<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T40 Pro 查词翻译 - 分屏设计高保真Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;padding:20px 0}
.screen{width:1640px;height:348px;background:#000;border-radius:8px;box-shadow:0 4px 40px rgba(0,0,0,.9);overflow:hidden;position:relative;transform-origin:top center;flex-shrink:0}
@media(max-width:1700px){.screen{transform:scale(.88)}}
@media(max-width:1460px){.screen{transform:scale(.72)}}
@media(max-width:1100px){.screen{transform:scale(.55)}}
.pg{display:none;width:100%;height:100%;position:absolute;top:0;left:0}
.pg.on{display:flex}

/* NAV */
.nb{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px;max-width:1640px;justify-content:center}
.nb button{padding:3px 8px;background:#1a1d24;color:#8a90a0;border:1px solid #2a2f38;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit;transition:all .15s}
.nb button:hover{background:#2a2f38;color:#cfd6e2}
.nb button.on{background:#ec9709;color:#000;border-color:#ec9709;font-weight:600}

/* COMMON */
.bk{position:absolute;left:2px;top:50%;transform:translateY(-50%);color:#5d6575;font-size:20px;cursor:pointer;z-index:5;padding:8px}
.bk:hover{color:#cfd6e2}
.dv{width:1px;background:#2a2f38;flex-shrink:0;align-self:stretch}
.lp{width:470px;padding:18px 20px 18px 28px;display:flex;flex-direction:column;justify-content:center;flex-shrink:0;position:relative}
.rp{flex:1;overflow-y:auto;padding:14px 20px;position:relative}
.rp::-webkit-scrollbar{width:2px}
.rp::-webkit-scrollbar-thumb{background:#3a3f4a;border-radius:2px}
.sn{width:65px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:1px;border-left:1px solid #2a2f38}
.tb{width:68px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:2px 0;gap:2px}

/* TYPOGRAPHY */
.hw{font-size:60px;color:#ec9709;font-weight:bold;line-height:1.15}
.hw2{font-size:48px;color:#ec9709;font-weight:bold;line-height:1.2}
.hw3{font-size:36px;color:#ec9709;font-weight:bold;line-height:1.4}
.py{font-size:30px;color:#fff;margin-top:2px}
.py2{font-size:26px;color:#a1aabe}
.dt{font-size:26px;color:#cfd6e2;line-height:1.55}
.dt2{font-size:24px;color:#cfd6e2;line-height:1.5}
.ds{font-size:22px;color:#cfd6e2;line-height:1.5}
.src{font-size:20px;color:#959caa;margin-top:6px}
.st{font-size:24px;color:#7b8396;padding:4px 0}
.st.a{color:#08c8a5}
.stb{font-size:30px;color:#cfd6e2;font-weight:bold;margin:6px 0 4px}
.ml{font-size:24px;color:#7b8396;text-decoration:underline;cursor:pointer}
.ex{color:rgba(207,214,226,.65)}
.en{color:#32e9e1}
.sep{height:1px;background:#1e2128;margin:8px 0}

/* Sidebar nav items */
.si{font-size:22px;color:#7b8396;padding:5px 2px;cursor:pointer;text-align:center;width:100%;line-height:1.3}
.si.a{color:#08c8a5}
.sd{width:1px;height:8px;background:#5d6575;margin:2px auto}

/* Toolbar */
.ti{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#cfd6e2;background:#1a1d24;border:1px solid #2a2f38}
.ti.hl{background:rgba(65,188,255,.14);border-color:#10d7ff}
.ti svg{width:20px;height:20px;fill:currentColor}

/* HOME */
.hdr{display:flex;align-items:center;gap:14px;padding:10px 24px 8px}
.htab{font-size:28px;color:rgba(207,214,226,.7);cursor:pointer}
.htab.a{color:#ec9709;font-weight:bold}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 24px;overflow-y:auto;flex:1}
.hi{background:#2a2f38;border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:26px;color:#cfd6e2}
.hi:hover{background:#3a3f4a}

/* Card */
.cd{background:#16181c;border-radius:8px;padding:6px 12px;margin-bottom:6px;display:inline-block}
.cdl{font-size:22px;color:#cfd6e2}
.cds{font-size:18px;color:#4c4f55;margin-top:2px}

/* Badges */
.bg{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:6px;background:linear-gradient(143deg,#f39b00 34%,#e23700 91%);color:#fff;font-size:12px;font-weight:bold;margin-right:6px;vertical-align:middle}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#08c8a5;margin-right:4px;vertical-align:middle}

/* Sentence */
.sl{flex:1;padding:16px 24px;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.stx{font-size:32px;color:#ec9709;font-weight:bold;line-height:1.45}
.stx2{font-size:32px;color:#cfd6e2;line-height:1.45}
.snote{font-size:20px;color:#959caa;margin-top:6px}

/* Btn group */
.bgrp{display:flex;gap:8px;margin-top:6px;align-items:center}
.bbtn{background:#23272e;border-radius:6px;padding:4px 10px;font-size:20px;color:#cfd6e2;cursor:pointer;display:flex;align-items:center;gap:4px}
.bbtn .lbl{font-size:18px}

/* Info row */
.irow{display:flex;gap:16px;font-size:26px;color:#7b8396;margin:4px 0}
.ival{color:#cfd6e2}

/* Playback icon */
.play{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.play-icon{font-size:22px;color:#cfd6e2}
.spk{font-size:24px;color:#cfd6e2;cursor:pointer}
</style>
</head>

<div class="screen" id="scr"></div>

const scr = document.getElementById('scr');
const nav = document.getElementById('nav');

P.forEach((p,i)=>{
  const d = document.createElement('div');
  d.className = 'pg' + (i===0?' on':'');
  d.id = 'p'+i;
  d.innerHTML = p.h;
  scr.appendChild(d);

  const b = document.createElement('button');
  b.className = i===0?'on':'';
  b.textContent = p.n;
  b.onclick = ()=>go(i);
  nav.appendChild(b);
});

function go(i){
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nb button').forEach(b=>b.classList.remove('on'));
  document.getElementById('p'+i).classList.add('on');
  nav.children[i].classList.add('on');
  // Reset scroll for right panels
  const rp = document.querySelector('#p'+i+' .rp');
  if(rp) rp.scrollTop = 0;
  const sl = document.querySelectorAll('#p'+i+' .sl');
  sl.forEach(s=>s.scrollTop=0);
}
</script>
